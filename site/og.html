<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Gabarit de l'image sociale — 1200×630</title>
<!--
  Gabarit de l'image de partage (Open Graph / Twitter Card).

  Il n'est PAS publié : il sert à produire site/public/assets/og.png, une fois, à la main.

  Mode d'emploi — ouvrir ce fichier dans un navigateur, puis DevTools › bascule mobile ›
  dimensions personnalisées 1200 × 630 › capture d'écran. Enregistrer sous
  site/public/assets/og.png.

  Le gabarit est versionné pour que l'image reste régénérable à l'identique, sans dépendre
  d'un outil externe ni d'un service en ligne.
-->
<style>
  @font-face {
    font-family: 'Manrope';
    font-style: normal;
    font-weight: 400 800;
    src: url('public/assets/manrope-latin-variable.woff2') format('woff2-variations');
  }

  html, body { margin: 0; padding: 0; }

  .og {
    width: 1200px;
    height: 630px;
    box-sizing: border-box;
    padding: 96px 88px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    font-family: 'Manrope', system-ui, sans-serif;
    color: #fff;
    /* Le fondu radial des tokens de l'app, transposé à la palette de la démo. */
    background:
      radial-gradient(120% 85% at 15% 0%, #4338CA 0%, rgba(67,56,202,0) 62%),
      radial-gradient(90% 70% at 100% 100%, rgba(245,158,11,0.30) 0%, rgba(245,158,11,0) 70%),
      #0a0a0a;
    position: relative;
    overflow: hidden;
  }

  /* Filet tricolore : indigo → cyan → ambre, un clin d'œil aux trois disciplines. */
  .og::after {
    content: '';
    position: absolute;
    left: 0; right: 0; bottom: 0;
    height: 10px;
    background: linear-gradient(90deg, #4338CA 0%, #0891B2 50%, #F59E0B 100%);
  }

  .mark { display: flex; align-items: center; gap: 22px; }
  .mark svg { width: 86px; height: 86px; }
  .mark .name { font-size: 52px; font-weight: 800; letter-spacing: -0.02em; }

  h1 {
    margin: 0;
    font-size: 72px;
    line-height: 1.08;
    font-weight: 800;
    letter-spacing: -0.03em;
    max-width: 13ch;
  }

  .tagline {
    margin: 26px 0 0;
    font-size: 29px;
    font-weight: 500;
    color: #c7d2fe;
  }

  .foot {
    margin-top: 8px;
    display: flex;
    align-items: center;
    gap: 18px;
    font-size: 23px;
    font-weight: 600;
    color: #a5b4fc;
  }
  .pill {
    border: 2px solid rgba(199,210,254,0.35);
    border-radius: 999px;
    padding: 9px 20px;
  }
</style>
</head>
<body>
<div class="og">
  <div class="mark">
    <svg viewBox="0 0 64 64" aria-hidden="true">
      <defs>
        <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stop-color="#818cf8"/>
          <stop offset="100%" stop-color="#F59E0B"/>
        </linearGradient>
      </defs>
      <circle cx="32" cy="32" r="25" fill="none" stroke="url(#g)" stroke-width="8"/>
      <g stroke="#fff" stroke-linecap="round">
        <line x1="32" y1="32" x2="23" y2="24" stroke-width="6"/>
        <line x1="32" y1="32" x2="40" y2="19" stroke-width="5"/>
      </g>
      <circle cx="32" cy="32" r="3.5" fill="#fff"/>
    </svg>
    <div class="name">Club'O'Clock</div>
  </div>

  <div>
    <h1>Le planning d'entraînement de ton club.</h1>
    <p class="tagline">Nage, pédale, cavale… fini le planning infernal&nbsp;!</p>
  </div>

  <div class="foot">
    <span class="pill">Logiciel libre AGPL-3.0</span>
    <span class="pill">Vos données restent chez vous</span>
  </div>
</div>
</body>
</html>
