<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 657.6 88.0" role="img" aria-labelledby="logo-title">
  <title id="logo-title">Club&#39;O&#39;Clock</title>
  <!--
    Logotype. Le mot est VECTORISÉ (Manrope 800 converti en tracés) : un <text> dépendrait d'une
    police que le contexte de rendu n'a pas toujours — favicon, aperçu de partage, impression —
    et retomberait en Times, ce qui détruirait le logo.

    Le O isolé entre les deux apostrophes n'est pas dessiné : sa chasse est réservée et un cadran
    prend sa place. C'est le seul point de couleur, donc ce qui fait la marque.

    Apostrophes : U+0027 (droite), jamais U+2019 — un nom de marque doit survivre à un
    copier-coller en terminal ou en JSON.

    Le groupe des glyphes porte l'échelle ET le retournement de l'axe Y (les polices ont Y vers
    le haut, SVG vers le bas). Les translations internes restent donc en unités de police.
  -->
  <defs>
    <linearGradient id="cadran" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4338CA"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
  </defs>

