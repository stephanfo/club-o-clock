<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="t">
  <title id="t">Club'O'Clock</title>
  <!--
    Le cadran seul, sans le mot : à 16 px, « Club'O'Clock » serait une bouillie de 3 px de haut,
    alors que le cadran reste identifiable. C'est précisément ce qui justifie d'avoir fait du O
    central la marque.

    Aiguilles à 10 h 10, la convention horlogère : elles forment un V ouvert vers le haut et
    dégagent le centre, là où 3 h 00 ou 6 h 30 tasseraient le dessin.
  -->
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4338CA"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
  </defs>

  <!-- Anneau. Épaisseur calée sur la graisse des fûts de Manrope 800, pour que le cadran
       ne paraisse ni plus léger ni plus lourd que les lettres qui l'entourent. -->
  <circle cx="32" cy="32" r="25" fill="none" stroke="url(#g)" stroke-width="8"/>

  <!-- Aiguilles : heures courte et épaisse, minutes longue et fine. -->
  <g stroke="#4338CA" stroke-linecap="round" fill="none">
    <line x1="32" y1="32" x2="23" y2="24" stroke-width="6"/>
    <line x1="32" y1="32" x2="40" y2="19" stroke-width="5"/>
  </g>
  <circle cx="32" cy="32" r="3.5" fill="#4338CA"/>
</svg>
