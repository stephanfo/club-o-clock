name: CI

# Rejoue la porte de qualité du projet (`composer check` : pint + phpstan niveau 5 +
# cohérence du schéma + suite de tests) sur chaque poussée et chaque pull request.
# C'est la même commande que celle documentée dans CONTRIBUTING.md : ce qui passe en
# local passe ici, et inversement — pas de porte de qualité à deux vitesses.
#
# Deux jobs : `qualite` joue la porte sur CHAQUE SGBD supporté (matrice), et `porte` en
# agrège le résultat sous un nom stable — c'est LUI que la protection de `main` exige.
# Ne pas renommer `porte` sans mettre à jour la règle de protection de la branche, sinon
# toutes les PR resteront bloquées en attente d'un check qui n'arrive jamais.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  # Une PR poussée trois fois de suite n'occupe pas trois runners.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qualite:
    name: Porte de qualité (${{ matrix.sgbd }})
    runs-on: ubuntu-latest

    # Les deux SGBD que le projet annonce supporter (INSTALL §2) sont joués à chaque fois.
    # `mysql` est celui de la PRODUCTION (OVH Pro sert MySQL 8.4) : c'est la référence, et
    # elle ne doit jamais cesser d'être testée. `mariadb` couvre les clubs qui déploieraient
    # ailleurs — MariaDB 11 n'est plus un clone de MySQL 8, une promesse non testée finirait
    # par être fausse.
    #
    # fail-fast désactivé : quand un moteur casse, on veut savoir si l'autre casse aussi —
    # c'est ce qui distingue une régression d'une incompatibilité de dialecte.
    strategy:
      fail-fast: false
      matrix:
        include:
          - sgbd: mysql
            image: mysql:8.4
            client: mysql-client
          - sgbd: mariadb
            image: mariadb:11.4
            client: mariadb-client

    services:
      # Les tests tournent sur InnoDB, jamais SQLite : le moteur doit reproduire les verrous
      # de ligne (FOR UPDATE) sur lesquels repose la sérialisation des inscriptions. Cf. le
      # commentaire de phpunit.xml.
      #
      # Les deux images acceptent les variables MYSQL_* (MariaDB les conserve en alias) et
      # exposent `healthcheck.sh` ou `mysqladmin` : on teste le port, seul dénominateur commun.
      db:
        image: ${{ matrix.image }}
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: cluboclock_test
        ports:
          - 3306:3306

    env:
      DB_CONNECTION: ${{ matrix.sgbd }}
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: cluboclock_test
      DB_USERNAME: root
      DB_PASSWORD: root

    steps:
      - uses: actions/checkout@v4

      - name: Installer PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          # gd est requis par composer.json (vignettes du logo de club).
          extensions: pdo_mysql, mbstring, openssl, bcmath, intl, fileinfo, zip, gd
          tools: composer:v2
          coverage: none

      # Le client en ligne de commande sert à Laravel pour charger le dump de schéma au début
      # de `migrate` et à `schema:check-drift` — il doit être celui du moteur testé, sinon le
      # dump est écrit ou relu dans le mauvais dialecte.
      - name: Installer le client ${{ matrix.sgbd }}
        run: sudo apt-get update && sudo apt-get install -y ${{ matrix.client }}

      - name: Attendre que la base réponde
        run: |
          for i in $(seq 1 30); do
            if mysqladmin ping -h 127.0.0.1 -P 3306 -uroot -proot --silent 2>/dev/null; then
              echo "Base prête."; exit 0
            fi
            sleep 2
          done
          echo "La base n'a pas répondu dans le délai imparti."; exit 1

      - name: Cache des dépendances Composer
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-

      - name: Installer les dépendances
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Installer Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      # public/build/ est un artefact gitignoré : sans ce build, `manifest.json` n'existe pas et
      # TOUT test qui rend une vue tombe en 500 (ViteManifestNotFoundException), y compris de
      # simples assertions d'affichage sans rapport avec le front.
      - name: Builder les assets front
        run: |
          npm ci
          npm run build

      - name: Préparer l'environnement
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Porte de qualité
        run: composer check

  # Point de contrôle unique, au nom STABLE, exigé par la protection de `main`.
  #
  # Les jobs de matrice s'appellent « Porte de qualité (mysql) » / « (mariadb) » : leurs noms
  # changeraient à chaque ajout de moteur, et une règle de protection qui les nommerait
  # individuellement casserait toute PR au prochain remaniement de la matrice. Ce job-ci ne
  # fait rien d'autre que refléter leur résultat, sous un nom qui ne bougera pas.
  #
  # `if: always()` + test explicite : sans cela, un job de matrice ANNULÉ ou en échec rendrait
  # celui-ci « skipped », que les règles de protection interprètent comme un succès.
  porte:
    name: Porte de qualité
    runs-on: ubuntu-latest
    needs: qualite
    if: always()
    steps:
      - name: Vérifier le résultat de la matrice
        run: |
          if [ "${{ needs.qualite.result }}" != "success" ]; then
            echo "La porte de qualité a échoué sur au moins un SGBD (${{ needs.qualite.result }})."
            exit 1
          fi
          echo "Porte de qualité franchie sur tous les SGBD de la matrice."
